# Project Grok config (tracked; published by deploy-orchestration via rules.manifest).
# Role write limits are the Grok sandbox profile (cursor: agent-landlock) and ROLE_KEY hooks in .grok/hooks/.
# Launchers pass --always-approve. These deny rules and the hooks still apply.
# Do not turn the project hooks off in /hooks. Since grok 1.0.75 that disable is per repository and drops the write guard here.
# deny > ask > allow across all scopes. Agents commit only through the project-facts.md Commit line.

[permission]
rules = [
  { action = "allow", tool = "read" },
  { action = "allow", tool = "grep" },
  { action = "allow", tool = "bash", pattern = "git status*" },
  { action = "allow", tool = "bash", pattern = "git log*" },
  { action = "allow", tool = "bash", pattern = "git diff*" },
  { action = "allow", tool = "bash", pattern = "git show*" },
  { action = "allow", tool = "bash", pattern = "git describe*" },
  { action = "allow", tool = "bash", pattern = "git rev-parse*" },
  { action = "allow", tool = "bash", pattern = "git ls-files*" },
  { action = "allow", tool = "bash", pattern = "git cat-file*" },
  { action = "allow", tool = "bash", pattern = "git worktree list*" },
  { action = "allow", tool = "bash", pattern = "git branch --show-current" },
  { action = "allow", tool = "bash", pattern = "ls *" },
  { action = "allow", tool = "bash", pattern = "cat *" },
  { action = "allow", tool = "bash", pattern = "jq *" },
  { action = "allow", tool = "bash", pattern = "* | jq *" },
  { action = "allow", tool = "bash", pattern = "find *" },
  { action = "allow", tool = "bash", pattern = "echo *" },
  { action = "allow", tool = "bash", pattern = "true" },
  { action = "allow", tool = "bash", pattern = "adb logcat*" },
  { action = "allow", tool = "bash", pattern = "./build_app*" },
  { action = "allow", tool = "bash", pattern = "./commit-build*" },
  { action = "allow", tool = "bash", pattern = "./orch/exec-preflight*" },
  { action = "allow", tool = "bash", pattern = "./orch/append-to-engineering-log*" },
  { action = "allow", tool = "bash", pattern = "./orch/todo-append*" },
  { action = "allow", tool = "bash", pattern = "./orch/todo-close*" },
  { action = "allow", tool = "bash", pattern = "./orch/get-builds-tag.sh*" },
  { action = "allow", tool = "bash", pattern = "./orch/reset-to-builds.sh*" },
  { action = "allow", tool = "bash", pattern = "./generate_pr.sh*" },
  { action = "allow", tool = "bash", pattern = "./orch/prepare-pr-rewrite*" },
  { action = "allow", tool = "bash", pattern = "./orch/plans-scope*" },
  { action = "allow", tool = "bash", pattern = "./orch/todo-open*" },
  { action = "allow", tool = "bash", pattern = "./orch/englog-recent*" },
  { action = "allow", tool = "bash", pattern = "./channel-*" },
  { action = "allow", tool = "bash", pattern = "./third_party/fetch-deps*" },
  { action = "allow", tool = "bash", pattern = "mkdir -p @@SANDBOX_PATH@@/*" },
  # search_replace and write are the permission class `edit` (unknown variants are skipped).
  { action = "allow", tool = "edit", pattern = "@@SANDBOX_PATH@@/**" },
  { action = "allow", tool = "edit", pattern = "**/project-facts.md" },
  # git add and git commit are not denied here. The orchestrator runs this host's
  # Commit line. .grok/hooks/master-blocks.sh denies them for every other role.
  # That file is deploy class master: every branch except orchestration.
  # The coder commits with ./build_app or ./commit-build.
  { action = "deny", tool = "bash", pattern = "git push*" },
  { action = "deny", tool = "bash", pattern = "git reset*" },
  { action = "deny", tool = "bash", pattern = "git checkout -- *" },
  { action = "deny", tool = "bash", pattern = "git rebase*" },
  { action = "deny", tool = "bash", pattern = "git tag*" },
]

[skills]
# Bundled skills to keep off. Do not add "review": the project skill overrides it by name.
disabled = ["pr-babysit", "execute-plan", "design", "check-work", "implement"]
