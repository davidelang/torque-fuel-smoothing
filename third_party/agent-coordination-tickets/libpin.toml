name = "agent-coordination-tickets"
git_https = "https://github.com/davidelang/agent-coordination-tickets.git"
git_ssh = "git@github.com:davidelang/agent-coordination-tickets.git"
git_sha = "89df8eda034af394ecc99d9cc1594b3b2b8ba851"
git_describe = "89df8ed"
track_branch = "master"
reproducible = true
build_time = "minutes"
requires_writable_src = false
build = ["cd src/go && d=$(mktemp -d) && GOCACHE=$d GOTOOLCHAIN=local CGO_ENABLED=0 GOPROXY=off go build -trimpath -buildvcs=false -ldflags '-s -w' -o channel . ; rc=$?; rm -rf \"$d\"; exit $rc"]
consumer_note = "Channel handoff tools. The built go/channel is committed as artifact/channel (multi-call: artifact/channel-{setup,arm,send,ping,status} are symlinks to it); agents run only those from the repo root and never need src/. src/bin/channel (POSIX sh) and src/bin/channel.py are alternative implementations of the same tool, kept in step by the connector tests; agents do not run them. Consumers do not rerun the connector's tests."

[[artifact]]
# Static Go binary (CGO_ENABLED=0, -trimpath, -buildvcs=false: same bytes from any checkout): committed, so a new worktree needs no library checkout.
path = "artifact/channel"
from = "src/go/channel"
sha256 = "7f71d73c3a152c722b87eb5ed4141e942dc6ed9add2b269b6b04e59383f556de"
